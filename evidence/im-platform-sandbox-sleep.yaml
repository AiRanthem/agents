- id: irc-tcp-tls
  platform: irc
  protocol: tcp_tls
  plugin: '@openclaw/irc@2026.10.10; source commit f7257f2c66884611f4f4043367eada029b704918 (not installed-runtime proof)'
  plugin_support: true
  connection_initiator: 'OpenClaw IRC plugin initiates an outbound connection to configured server host:port: tls.connect
    when tls=true, net.connect otherwise. The client does not expose a listener for an IRC server to initiate a replacement
    connection.'
  paused_state: After T1 socket closure, the server removes that client session/nick/channel membership when it learns the
    connection closed; if the path is a silent failure, server PING/PONG detection is implementation-timed. RFCs do not specify
    a universal timeout. No OpenClaw code executes while Sandbox is suspended.
  user_send_dm: If server currently treats the target nickname as unused, RFC 2812 specifies 401 ERR_NOSUCHNICK. Before it
    detects the dead session, the nick may still appear online and a PRIVMSG may be routed to an unresponsive connection.
    IRC baseline does not guarantee an offline mailbox or later delivery; NickServ nick registration alone is not message
    storage.
  user_send_group: If sender remains in the channel and its modes permit sending, PRIVMSG to the channel fans out to current
    members. Bot removed from channel after disconnect gets no event; sender may send successfully and other members receive
    it. 404 ERR_CANNOTSENDTOCHAN means sender/channel permission restriction, not that the bot is absent. If channel empties
    or network services persist it, exact behavior is network-specific.
  new_message_delivery: No new connection/wake request reaches the sleeping plugin through baseline IRC. Direct messages to
    an unused nick fail under the standard 401 condition; messages to a still-populated channel may be delivered only to the
    current members. Channel and user send acceptance are not an OpenClaw delivery acknowledgment.
  unacked_retry: OpenClaw documents that an IRC PRIVMSG already accepted into its durable ingress queue remains pending/retryable
    across Gateway restart and is serialized per peer/channel. This local accept-to-dispatch queue does not include messages
    never received while disconnected. IRC has no replayable delivery ID; local event ID is scoped to one TCP connection epoch.
  offline_new_event_retention: No general IRC server offline-message retention/replay guarantee. IRCv3 CHATHISTORY is optional,
    capability-negotiated and only returns data still available from a server or bouncer; it is WIP. External bouncer/network-services
    behavior is outside the baseline and unspecified.
  resume_path: On process resumption after close detection, monitorIrcProvider schedules a client-side reconnect using exponential
    backoff (initial 1s, max 30s, factor 2, 20% jitter; reset after 60s stable). A new connection sends optional PASS then
    NICK/USER; after 001 it sends configured NickServ commands and re-JOINs configured channels. Timers and monitor require
    Sandbox execution.
  openclaw_catchup_filters: Inspected client.ts/config-schema.ts implement no IRCv3 CAP/CHATHISTORY or SASL AUTHENTICATE flow.
    IRC ingress generates local:<epoch>:<sequence> only after receiving PRIVMSG. Channel events queued before disconnect can
    replay; monitor.ts drops old-epoch DMs because nick ownership can change. No platform-history catch-up path was found
    in the inspected plugin.
  wake_inference: 'No automatic wake: the plugin is the outbound TCP/TLS client, while suspended code cannot process IRC input
    or initiate a new socket. An external mechanism must resume Sandbox; only then can OpenClaw observe/discover disconnection
    and reconnect. Optional external bouncer/history services can change retention but are not baseline wake channels.'
  unknowns:
  - Actual server's detection interval and timeout, and whether it observes clean close or only a silent network failure.
  - Whether NickServ or network services reserve/reclaim the nick or implement private-message buffering.
  - Whether a specific IRC network supports CHATHISTORY, and its stored history window, privacy rules, and availability.
  - Whether actual configured server permits PASS/NickServ login or requires unsupported SASL; no network was specified.
  - Whether a specific channel persists when empty, its modes, and whether sender may post during T2.
  - No live connection or runtime/E2E behavior was tested; package source snapshot is not proof of deployed plugin version.
  evidence:
  - source: S141
    kind: C
    locator: connectIrcClient; socket creation; socket 'connect' registration; 001 handling; tryRecoverNickCollision; IRC_LIVENESS_TIMEOUT_MS/livenessTimer
    supports:
