id: im-platform-sandbox-sleep
body: evidence/im-platform-sandbox-sleep.md
topic: 15个IM平台在四类外部接入方式下的沙箱休眠、离线新消息与恢复行为
summary: 21个所查插件接入场景及1个平台能力场景；纯出站客户端不能在全断休眠时自唤醒，Webhook新请求可条件触发外部恢复；补投由平台契约与插件恢复/过滤共同约束。
kind: search
inputs:
  researched_on: '2026-11-04'
  platform_count: 15
  baseline_case_count: 22
  implemented_case_count: 21
  cases_by_protocol:
    websocket: 8
    webhook: 10
    http_polling: 3
    tcp_tls: 1
  excluded:
  - Signal
  - iMessage
  - sandbox_internal_SSE_RPC_stdio
  - unreviewed_community_forks
  runtime_validation: not_executed
  installed_version_validation: not_executed
  source_snapshots:
    openclaw_common:
      commit: f7257f2c66884611f4f4043367eada029b704918
      package_version: 2026.10.10
    openclaw_slack_whatsapp:
      commit: 7dc3350cb9f08fcf9a0af5c4845a20d5b2f1a8be
      tag: v2026.10.10
    wechat_ilink:
      commit: 874637a0dbc24050f72d1385add4fc6170a2d726
      version: 2.4.10
    qqbot_plugin:
      commit: 89988812442583bf47c34b89f9abf5fd4b85df0b
      version: 2.0.4
    qqbot_sdk_repo_lock:
      commit: ca55d9c395b582b7fcfad0ec27209c35dd04e0b3
      version: 1.0.4
      note: Plugin range ^1.0.4; repository lock is not included in the published-file allowlist, so installed resolution
        is unknown.
    dingtalk_connector:
      commit: 88df00ee594072e9941ef3f71da90a37f3291ad3
      version: 0.8.27
    wecom_plugin:
      commit: 2b8c84e696ec98c967ff95030270c6acb5c4b51d
      version: 2026.10.19
    baileys:
      commit: 7e7b0757e3f9f3c7789fb1cfd2f241d5002a199a
