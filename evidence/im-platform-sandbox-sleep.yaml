  plugin_support: true
  connection_initiator: '[D/C] OpenClaw initiates GET /api/v4/websocket. Mattermost''s official API exposes connection_id
    and sequence_number reconnect query parameters. The inspected OpenClaw plugin sends no query parameters; it authenticates
    after upgrade with authentication_challenge.'
  paused_state: '[I/C] Users can continue sending ordinary channel/DM posts if their own access is unchanged. [C] If Mattermost
    has detected the old connection as inactive and retained its in-memory WebConn with a valid session, broadcasts can still
    enqueue onto its send buffer; once full, the server removes that connection. Bot user identity persists. When all its
    WebSockets are inactive and no cluster node has an active connection, server queues offline presence.'
  user_send_dm: '[D/I] Yes, subject to normal DM access. OpenClaw documents DMs and group DMs; its default DM policy can still
    deny processing or request pairing after delivery.'
  user_send_group: '[D/I] Yes, subject to existing channel/private-channel membership and server permissions. Server delivery
    event routing still applies user and channel eligibility.'
  new_message_delivery: '[C] Conditional server-source capability: a compliant authenticated client with a still-valid session
    can resume the same retained WebConn and receive events from deadQueue and pending send buffer. [U] No official API promise
    of durable/unbounded event retention; memory loss, session invalidation, queue overflow, old connection still active,
    reaping, restart or HA lookup failure may prevent it. [C] The inspected OpenClaw plugin does not invoke this resume path,
    so it does not receive those offline events through its normal reconnect.'
  unacked_retry: '[C/U] Server event sequences and client-supplied sequence_number support bounded reconnection replay in
    inspected source. No event-level chat processing ACK is configured by OpenClaw; posted_ack is not set and is not an offline-retention
    promise. Plugin durable ingress protects only events received by the plugin.'
  offline_new_event_retention: '[C] In-memory WebConn send channel capacity is 256 WebSocketMessage entries; deadQueue is
    a separate 128-entry ring of sequence-numbered WebSocketEvent frames already written toward the socket. Those counts include
    event types beyond ordinary posts and are not message-count or TTL guarantees. Inactive cleanup checks lastUserActivityAt
    against a 5-minute stale threshold on a 5-minute reaper tick; this is not a fixed five-minute period from disconnect.
    [U] Actual time and HA/server behavior are deployment-dependent.'
  resume_path: '[C] Mattermost server connectWebSocket reuses a connection only when the request has connection_id, the HTTP
    Upgrade context has an authenticated user ID, and the same user/connection is still retained. It then uses sequence_number.
    No separate feature flag appears in this inspected API execution path. [C] OpenClaw monitor constructs a bare /api/v4/websocket
    URL and sends auth challenge after opening; its local sequence variable numbers outbound client actions, not server event
    sequence. Even if the same OpenClaw process resumes, this plugin has no platform connection ID/event cursor to resume
    with. A server restart removes in-memory queues; clustered retrieval is conditional and falls back as unreliable on lookup
    failure.'
  openclaw_catchup_filters: '[C] No general startup/reconnect history scan exists in the Mattermost monitor. Explicit read.ts
    history tool fetches REST posts using before/after cursors only when invoked. monitor-thread-backfill can fetch bounded
    earlier posts for context after a later thread message when thread history is cold, excludes the triggering post and checks
    sender access; those older posts are context rather than individual missed event triggers. Flat DMs do not use thread
    backfill by default.'
  wake_inference: '[I] A paused sole client does not receive a reverse connection or auto-wake. After execution resumes, the
    plugin reconnects as a fresh event listener and can process future live posted events. The platform could replay during
    pause only if a custom client used the conditional resume protocol and server queue state remained; OpenClaw 2026.10.10
    does not do that. No runtime or E2E validation performed.'
  unknowns:
