    delivery accepted regardless of later agent execution.'
  user_send_dm: Yes, subject to normal Telegram bot/chat rules; endpoint reachability and processing are separate.
  user_send_group: Yes, if bot remains in group and privacy/permissions/update filters make the message visible.
