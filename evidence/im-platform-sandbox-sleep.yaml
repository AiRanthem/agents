- id: whatsapp-web-baileys-ws
  platform: whatsapp
  protocol: websocket
  plugin: OpenClaw @openclaw/whatsapp@2026.10.10 (source tag v2026.10.10, commit 7dc3350cb9f08fcf9a0af5c4845a20d5b2f1a8be)
    with Baileys 7.0.0-rc14 (tag commit 7e7b0757e3f9f3c7789fb1cfd2f241d5002a199a)
  plugin_support: true
  connection_initiator: 'C: Gateway/Baileys client creates a WebSocket to wss://web.whatsapp.com/ws/chat and calls connect();
    I: after all old sockets are gone, WhatsApp cannot create a new inbound TCP/WebSocket connection to the paused Sandbox
    through this client channel. The Gateway must execute again to connect.'
  paused_state: 'I: while Sandbox execution is paused, the Gateway heartbeat, socket monitor, reconnect loop, inbound listeners,
    and Agent do not execute. Persisted linked-device credentials may remain, but do not prove an active connection or reception.
    D: linked devices connect independently and do not require the primary phone to stay online; primary-phone inactivity
    over 14 days logs linked devices out, and linked-device inactivity over 30 days causes automatic disconnect. Whether WhatsApp
    considers a disconnected Baileys session active is U.'
  user_send_dm: 'D/I: Assuming account and sender permissions remain valid, user can submit a DM. Offline reception by this
    device is separate. The reviewed UK policy allows temporary retention of still-undelivered encrypted messages for up to
    30 days, without a Baileys-device replay SLA.'
  user_send_group: 'D/I: assuming group membership and send permissions remain valid, a user can submit a group message. The
    same platform retention caveat applies. Group double-check semantics indicate all group members received the message and
    do not identify this specific linked device.'
  new_message_delivery: 'D/U: Under the reviewed UK policy, still-undelivered encrypted messages may be temporarily retained
    up to 30 days and deleted after delivery or expiry. A double gray check can mean recipient phone or another linked device
    received it; group checks aggregate members. None identifies this Baileys instance or proves local admission/Agent work.
    Per-companion queueing and replay completeness are unknown.'
  unacked_retry: 'U: no public WhatsApp/Baileys contract found for server retry count, retry duration, or exact replay behavior
    for an event not ACKed by this companion. C: when Baileys handles an inbound message, it sends a delivery receipt before
    emitting messages.upsert; it attempts NACK only if an exception happens before the ack. Thus a platform delivery mark/receipt
    can precede OpenClaw durable admission.'
  offline_new_event_retention: 'D/U: The reviewed UK privacy-policy revision effective 2026-03-26 says still-undelivered encrypted
    messages may be retained up to 30 days, then deleted. This is a regional policy statement, not a per-companion replay
    SLA or an OpenClaw reply window. Other-device delivery does not prove this Baileys instance received the event.'
  resume_path: 'I/C: an external mechanism first resumes the Sandbox; OpenClaw then creates/monitors a client WebSocket using
    saved linked-device auth. Baileys handles offline_preview by sending offline_batch count=100, processes offline nodes,
    and marks pending notifications received when the offline batch is complete. Offline messages can be emitted as messages.upsert
    type append. Baileys also has a separate messaging-history.set event; OpenClaw config sets syncFullHistory=false and its
    WhatsApp inbound listener listens to messages.upsert only. None of these sources establishes a retention SLA or complete
    replay.'
  openclaw_catchup_filters: 'C: only notify/append upserts enter this handler. Age filtering applies only to append. Normal
    startup/non-qualified reconnect drops append messages older than connectedAt minus 60 seconds; stale appends may be marked
    read and completed without Agent dispatch. A maximum 20-minute append catch-up window is conditionally supplied only when
    openedAfterRecentInbound is true; this requires reconnectAttempts>0 and a recent lastHandledInboundAt in the same controller.
    A fresh controller/start has no such in-memory inbound and uses the 60-second guard. After the reconnect window, append
    handling returns to startup-style age filtering. Notify bypasses this stale-append filter. Accepted inbound is journaled
    in an account-scoped queue under stateDir and deduped by remoteJid/message id; completed IDs have a 7-day/5000-entry retention.
    Queue admission failures after [0,100,300] delay retries are logged and dropped.'
  wake_inference: 'I: no automatic Sandbox wake is provided by this standard WS mode. While the sole receiver is paused and
    the prior connection is gone, no executing client exists to receive the message or reconnect. An independent external
    wake mechanism must resume the Sandbox before the Gateway can attempt reconnection. Even after resume, platform retention
    and Baileys offline catch-up do not bypass OpenClaw''s append filters or guarantee Agent reply.'
  unknowns:
  - Actual Sandbox OpenClaw/plugin/Baileys versions and runtime configuration are not provided; this report pins source for
    analysis only.
  - Actual WA Web protocol version negotiated at runtime is unknown because the pinned OpenClaw code fetches the latest Baileys
    version dynamically.
  - WhatsApp/Baileys server retry and replay semantics for an unacknowledged event, including per-linked-device queue lifetime
    and completeness, are not publicly guaranteed by the sources inspected.
  - Whether another linked device received a message, whether that affects a particular Baileys companion's offline backlog,
    and how WhatsApp applies its 30-day undelivered-message rule across devices are unknown.
  - Whether the linked device is automatically considered inactive while Sandbox is paused, and whether the primary phone
    is used often enough to satisfy the 14-day rule, are environment-dependent and unverified.
  - Whether the Gateway resumes the existing controller or starts a fresh process affects the conditional 20-minute reconnect
    window; stateDir persistence affects local durable replay.
  - Actual sender allowlists, DM/group admission rules, Agent execution, and final reply are unverified. No runtime/E2E test
    was performed.
