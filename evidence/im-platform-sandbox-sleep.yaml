  user_send_group: Yes, if bot remains in the group and privacy/permissions/update filters make the message visible to the
    bot.
  new_message_delivery: T2 produces no request to the stopped Sandbox. Updates still pending on Telegram may be fetched after
    recovery, subject to the 24-hour maximum, offset and update visibility.
  unacked_retry: getUpdates returns earliest unconfirmed updates; an update is confirmed when a later getUpdates call uses
    offset greater than its update_id. Without advancing offset it remains eligible for redelivery until expiration or explicit
    drop.
  offline_new_event_retention: 'D: at most 24 hours, not a guarantee of exactly 24 hours or complete delivery under all conditions.
    No published universal queue capacity guarantee found.'
  resume_path: 'C: OpenClaw durable ingress appends raw update before scheduling persistence of the restart offset. Restore
    actively resumes polling from persisted cursor; already-admitted local ingress is replayed separately. Offset write scheduling/commit
    race can cause duplicate fetch after crash. Ordinary polling startup calls deleteWebhook({drop_pending_updates:false}),
    so clearing the webhook does not drop pending updates.'
  openclaw_catchup_filters: OpenClaw docs document stale-legacy-import rejection for legacy spool entries older than 24h (migration-only);
    replacing a known bot clears old local ingress rows. Fixed source shows ordinary polling startup passes drop_pending_updates:false.
    Group privacy/filter settings still apply. Local durable queue dedupe is bounded, not exactly-once.
  wake_inference: 'No automatic wake under the no-external-wake premise: stopped client cannot issue another long-poll request;
    an external mechanism must resume Sandbox. After resume, recovery is active client polling.'
  unknowns:
  - No platform guarantee for the exact survival time of each update beyond the stated 24h maximum, queue capacity, or delivery
    ordering through all failures.
  - Exact installed OpenClaw version/config and state-directory persistence are unknown.
  - Per-bot group privacy, membership, allowed_updates and account policy are not verified.
