    kind: C
    locator: IRC_RECONNECT_BACKOFF; IRC_RECONNECT_STABLE_MS; createIrcReconnectBackoff
    supports:
    - resume_path
  - source: S144
    kind: C
    locator: createIrcIngressMonitor; openConnection; accept; local event ID construction
    supports:
    - unacked_retry
    - openclaw_catchup_filters
  - source: S145
