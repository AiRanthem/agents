  material_corrections:
  - QQ official short-disconnection Resume replay contract added; numerical TTL remains unknown. SDK checkpoint ordering remains
    distinct from the stronger OpenClaw documentation claim.
  - LINE fallback describes the complete classification predicate, including allowed unmatched errors; allowance does not
    guarantee safety or delivery.
  - Teams message-extension invoke retries remain separate from normal messages and the implemented adaptiveCard/action path.
    Google Chat add-on app-command payload support narrowed to checked source.
  - Mattermost described as bounded conditional server-source continuation, not a reliability SLA; checked plugin does not
    use it. Discord clean close prevents old-session Resume.
  - WhatsApp UK policy scope and append-only conditional reconnect filtering retained; local queues, platform queues, history
    and protocol replay remain distinct.
