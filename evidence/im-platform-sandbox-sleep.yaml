evidence_labels:
  D: 平台公开文档契约
  C: 所查固定源码或维护方实现说明
  I: 统一前提下机制推论
  U: 无公开保证或环境未知
common_assumptions:
- 机器人原本正常，权限/订阅/成员资格原本有效；所有必要接收进程在沙箱内并停止执行，所有旧连接已中断，没有其他在线接收客户端。
- Pause可保留内存；进程重建/崩溃另行区分。T1已投未ACK与T2完全离线新事件不能混同。
- 除Webhook明确外部可达唤醒入口分支外，无独立唤醒方。请求失败或超时不证明此前没有触发恢复；及时ACK/持久化不是唤醒曾发生的必要条件。
- 身份存在、连接离线与UI在线状态分开；历史、平台事件队列、WS回放与本地已收队列分开。收到/ACK/唤醒/Agent执行/回复成功分开。
