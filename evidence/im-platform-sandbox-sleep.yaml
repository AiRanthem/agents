rows:
- id: feishu-websocket
  platform: feishu
  protocol: websocket
  plugin: '@openclaw/feishu; openclaw/openclaw main SHA f7257f2c66884611f4f4043367eada029b704918 (read 2026-11-04); OpenClaw
    docs require >=2026.5.29; deployed version unknown. Separate official Node SDK evidence is larksuite/node-sdk 1.76.0 at
    b188be60134d409b61259546bcf69c731d2b0b7c.'
  plugin_support: true
  connection_initiator: Developer-side OpenClaw process creates SDK WSClient and starts it; SDK performs connection/reconnect.
    Current OpenClaw main supervises after SDK terminal reconnect error by closing/recreating the client with exponential
    delays 1s to 30s cap.
  paused_state: With all old connections broken and Sandbox code not executing, no SDK heartbeat, handler, or reconnect executes.
    App/bot/chat identity is not shown as removed; do not infer a UI online indicator. User can still send DM/group messages
    assuming app visibility, permissions, and group membership remain. No reverse WS connection is initiated by Feishu on
    the user's message.
  user_send_dm: Yes, conditional on prior visibility and permissions; sending to Feishu chat is distinct from event delivery
    to OpenClaw.
  user_send_group: Yes, conditional on bot membership, visibility, and prior app permissions; receiving/processing may still
    require mention and OpenClaw policy.
  new_message_delivery: No reachable WS client while fully paused. Platform docs specify retry of failed event pushes, but
    provide no located public guarantee for events generated while no client is online and never pushed to a client.
  unacked_retry: 'D: A pushed event whose WS handler fails/throws or does not complete successfully within 3s is considered
    failed; retry at 15s, 5m, 1h, 6h, maximum 4 retries after initial attempt. ACK success may still produce duplicates under
    at-least-once delivery.'
  offline_new_event_retention: 'U: No public guarantee located for server queue, retention duration, or catch-up/replay of
    new events generated during total WS disconnection. This is not proof that no internal queue exists.'
  resume_path: SDK reconnects/re-authenticates; current OpenClaw main adds an outer recreate loop after SDK terminal retry
    exhaustion. No documented or source-observed offset/cursor resume contract for Feishu event WS. Only already-admitted
    OpenClaw ingress records can be replayed by its own queue.
  openclaw_catchup_filters: Current main durable ingress accepts im.message.receive_v1 only with stable event_id (plus drive.comment
    event); durable admission precedes agent dispatch. Later parsing, self-bot suppression, message dedupe, DM pairing policy,
    group allowlist and mention gates can suppress Agent work. Other event types lack same queue guarantee.
  wake_inference: 'I: No automatic wake from WS while only receiver is paused; no new incoming HTTP request or independent
    signal exists. It cannot auto-reply before process resumes and receives/processes an event.'
  unknowns:
  - Feishu server-side retention and replay behavior for events never delivered while no WS connection exists.
  - Final status/queryability after the finite failed-delivery retry schedule expires.
  - Target OpenClaw/plugin/SDK versions, actual bot UI status, and real resume-first-message behavior.
  - No runtime or E2E test was executed.
  evidence:
  - source: S001
    kind: D
    locator: Event notification / failure retransmission; 3s and retry schedule
    supports:
    - unacked_retry
    - offline_new_event_retention
  - source: S002
    kind: D
    locator: long connection setup and limitations
    supports:
    - connection_initiator
    - unacked_retry
  - source: S003
    kind: C
    locator: getFeishuWsReconnectDelayMs; monitorWebSocket
    supports:
    - connection_initiator
    - resume_path
  - source: S004
    kind: C
    locator: inspectFeishuIngressEnvelope; invokeWebhook admission
    supports:
    - openclaw_catchup_filters
  - source: S005
    kind: C
    locator: Inbound durability; docs version floor
    supports:
    - resume_path
    - openclaw_catchup_filters
  - source: S006
    kind: C
    locator: DM/group policies and mention requirement
    supports:
    - openclaw_catchup_filters
  numeric_claims:
  - claim: 3s handler success window; failure retries at 15s, 5m, 1h, 6h, maximum 4 retries
    scope: Feishu event push, WebSocket handler failure
    source: S001
  - claim: OpenClaw outer reconnect backoff begins at 1s and caps at 30s
    scope: current main source only; not deployed-value evidence
    source: S003
- id: feishu-webhook
  platform: feishu
  protocol: webhook
  plugin: '@openclaw/feishu; openclaw/openclaw main SHA f7257f2c66884611f4f4043367eada029b704918 (read 2026-11-04); OpenClaw
    docs require >=2026.5.29; deployed version and route reachability unknown.'
  plugin_support: true
  connection_initiator: Feishu initiates HTTP POST to the configured event callback URL; current OpenClaw main registers a
    Gateway HTTP route. No old WS connection is needed.
  paused_state: Identity/chat remains subject to app configuration and permissions. User can still send DM/group messages.
    Whether any process receives POST depends on endpoint reachability. H0 means no valid response, which does not establish
    that no wake trigger happened; H1 means an externally reachable authorized endpoint with wake capability; H2 means endpoint
    returned 200.
  user_send_dm: Yes, conditional on prior visibility and permissions.
  user_send_group: Yes, conditional on bot membership, visibility, and permissions; OpenClaw policy/mention rules still apply
    after event receipt.
  new_message_delivery: 'Feishu may POST to configured URL independent of the old WS connection. H0 only establishes no valid
    response: a reachable wake front end could have triggered recovery before ACK failed, and Feishu can still retry. Failed
    delivery retries are finite; no indefinite event retention guarantee located. H1 has an available wake-capable endpoint
    by scenario assumption; wake trigger and event ACK/processing guarantees are separate.'
  unacked_retry: 'D: HTTP callback must return HTTP 200 within 3s (TCP connect timeout 2s); failed push is retried at 15s,
    5m, 1h, 6h, maximum 4 retries after initial attempt. At H2 200, platform sees transport success; later Agent failure is
    not known to Feishu as an event delivery failure.'
  offline_new_event_retention: 'U: Finite retry may apply to failed attempts that occur while paused, but no public guarantee
    of indefinite retention or replay after retry exhaustion. Do not infer platform retention from OpenClaw chat history or
    local queue.'
  resume_path: If Sandbox later resumes, Gateway/plugin route starts again. There is no polling cursor for webhook mode. Current
    OpenClaw main durably admits selected authenticated events before returning 200; its queue can retry pending/retryable
    entries across Gateway restart, independently from Feishu retries.
  openclaw_catchup_filters: Webhook verifies signature and timestamp; current setup docs state +/-1h timestamp tolerance and
    24h replay guard. Only durable event types include im.message.receive_v1 with stable event_id; then message parsing, duplicate/self-bot
    suppression, pairing/allowlist/mention gates apply. Successful HTTP 200 does not ensure Agent completion/reply.
  wake_inference: 'I: Without a working external wake-capable ingress there is no automatic wake. With such an ingress (H1),
    the request may trigger recovery; a 3s ACK, durable event admission, and business processing are separate outcomes and
    are not prerequisites for the wake trigger. Even if ACK times out, Feishu may retry. H2 ACK does not guarantee reply and
    downstream Agent failure is not a transport-level failure visible to Feishu.'
  unknowns:
  - Actual inbound URL reachability, authorization, and wake behavior in target environment.
  - Feishu event retention after all finite retries fail, and whether later platform delivery occurs.
  - Target OpenClaw/plugin version and runtime durable storage configuration.
  - No runtime or E2E test was executed.
  evidence:
  - source: S001
    kind: D
    locator: Webhook event notification and failure retransmission
    supports:
    - unacked_retry
    - offline_new_event_retention
  - source: S003
    kind: C
    locator: Webhook route, signature handling, durable 200 and 500 paths
    supports:
    - connection_initiator
    - resume_path
    - openclaw_catchup_filters
  - source: S004
    kind: C
    locator: durable event recognition and admission
    supports:
    - resume_path
    - openclaw_catchup_filters
  - source: S005
    kind: C
    locator: Inbound durability; Webhook delivery window
    supports:
    - resume_path
    - openclaw_catchup_filters
  - source: S006
    kind: C
    locator: DM/group policies and mention requirement
    supports:
    - openclaw_catchup_filters
  numeric_claims:
  - claim: HTTP 200 within 3s; TCP connect timeout 2s; retry at 15s, 5m, 1h, 6h, maximum 4 retries
    scope: Feishu event Webhook delivery
    source: S001
  - claim: Webhook signed timestamp tolerance +/-1h; replay guard 24h
    scope: current OpenClaw Feishu webhook implementation docs; not Feishu platform retention
    source: S005
- id: wechat-ilink-http-polling
  platform: wechat_ilink
  protocol: http_polling
  plugin: '@tencent-weixin/openclaw-weixin 2.4.10, current-main snapshot 874637a0dbc24050f72d1385add4fc6170a2d726'
  plugin_support: true
  connection_initiator: '[C] OpenClaw plugin POSTs /ilink/bot/getupdates with get_updates_buf; server holds request until
    message/timeout. No platform-initiated reverse connection in this receive path.'
  paused_state: '[I/U] Poll loop is not executing and no pending poll remains after all connections fail; local account/cursor
    files may remain. Platform bot presence/UI state is undocumented.'
  user_send_dm: '[U] Plugin supports direct chats, but no reviewed platform contract says whether messages are accepted/queued
    while its receiver is offline; sending does not prove event delivery.'
  user_send_group: N/A for the checked plugin; OpenClaw docs say direct chats only and do not advertise group capability.
  new_message_delivery: '[C/U] No getUpdates request while paused. On restore, plugin sends its locally saved cursor. No public
    guarantee found for fully-offline event retention, replay range, expiry, or complete catch-up.'
  unacked_retry: '[C] No separate per-message ACK in the reviewed plugin receive path. Network/API poll failures retry after
    2s, then back off 30s after 3 consecutive failures; that is poll-request retry, not event-redelivery contract. On success
    the monitor saves a nonempty returned cursor before processing msgs.'
  resume_path: '[C] Load {accountId}.sync.json (with compatibility/legacy fallbacks), then POST saved get_updates_buf; if
    absent, send empty string. Cursor write is synchronous local file write.'
  openclaw_catchup_filters: '[C] No explicit age cutoff found in monitor/processOneMessage path; create_time_ms is used for
    timing/context. Authorization may still drop messages. Presence of cursor does not prove old messages are retained/replayed.'
  wake_inference: '[I] HTTP polling is client-initiated; with the process stopped no long-poll or new request can wake it.
    No separate external wake receiver is evidenced.'
  unknowns:
  - What the iLink server guarantees for cursor interpretation, offline queue retention, expiry, and replay after the client
    resumes.
  - Whether an offline direct message is accepted/queued by the platform; group support is not advertised by this plugin.
  - Whether a new QR-bound token continues from an old local cursor; account save does not itself clear the cursor, while
    explicit account clear does.
  offline_new_event_retention: 'U: Server offline retention, cursor expiry and complete catch-up are not publicly guaranteed
    by the reviewed client-based protocol reference.'
  evidence:
  - source: S007
    kind: C
    locator: How it works; direct chats only; external Tencent plugin
    supports:
    - plugin scope
    - group N/A
  - source: S008
    kind: C
    locator: Protocol reference explicitly says client-code-based and not full server contract
    supports:
    - server contract limit
  - source: S009
    kind: C
    locator: getUpdates endpoint, request/response cursor and current client behavior
    supports:
    - poll protocol
    - cursor semantics
  - source: S010
    kind: C
    locator: load persisted cursor or start empty
    supports:
    - resume path
  - source: S011
    kind: C
    locator: client long-poll call
    supports:
    - connection initiator
  - source: S012
    kind: C
    locator: save response cursor before processing returned msgs
    supports:
    - checkpoint ordering
    - unacked boundary
  - source: S013
    kind: C
    locator: local account sync-file path
    supports:
    - local cursor persistence
  - source: S014
    kind: C
    locator: -14 stale-token one-hour in-memory pause
    supports:
    - account session failure
  numeric_claims:
  - claim: Default long-poll timeout is 35,000ms; server can suggest a next timeout.
    scope: Plugin source default, not platform retention or timeout SLA.
    source: S015
  - claim: Stale-token -14 pauses account API calls for one hour.
    scope: Plugin behavior only; it does not re-login or describe server token validity.
    source: S014
  - claim: Three consecutive poll failures trigger a 30s backoff; earlier failures retry after 2s.
    scope: Plugin poll loop retry, not platform event retry.
    source: S015
- id: qqbot-websocket
  platform: qqbot
  protocol: websocket
  plugin: '@tencent-connect/openclaw-qqbot 2.0.4 at 89988812442583bf47c34b89f9abf5fd4b85df0b; package.json range ^1.0.4; repository
    package-lock resolves @tencent-connect/qqbot-nodejs 1.0.4 at SDK commit ca55d9c395b582b7fcfad0ec27209c35dd04e0b3. package-lock
    is excluded by plugin package file allowlist, so actual installed consumer dependency is unknown. SDK main 1.0.5 at 429a0f1b798f3b0fcef3679e207dbc0469a1df2d
    checked as cross-check.'
  plugin_support: true
  connection_initiator: '[C] Client fetches access token and gateway URL, then initiates WebSocket. Heartbeats and op 7/9
    reconnect handling run in client; server reconnect opcode is not a server-created connection to the stopped Sandbox.'
  paused_state: '[I/U] WS and heartbeat stop when process stops; plugin account credentials and session.json may persist.
    User-visible online/presence status is not established by reviewed sources.'
  user_send_dm: '[U] Plugin/docs support QQ C2C, but no reviewed current platform contract guarantees acceptance/queuing during
    receiver outage.'
  user_send_group: '[U] Plugin/docs support QQ groups (normally @mention-controlled); offline acceptance/queuing is not documented.'
  new_message_delivery: 'D/C: QQ official protocol describes replay of missed events after a short disconnection followed
    by successful Resume; no numeric short-time bound is published. SDK restores sessionId/lastSeq and tries RESUME, or IDENTIFY
    when absent/invalid. This is not a guarantee for arbitrary sandbox sleep durations.'
  unacked_retry: 'C/U: SDK advances lastSeq and invokes session persistence before asynchronous DISPATCH callbacks; RESUME
    includes that seq. This does not prove disk fsync or durable ingress completion. Platform replay boundaries remain unknown.
    D: Official guidance recommends recording s after event handling; successful Resume replays subsequent events and ends
    with RESUMED.'
  resume_path: '[C] Plugin stores QQ session state in session.json using SDK kvSessionPersistence/FileKVStore. SDK restores
    sessionId/lastSeq; HELLO leads to op 6 RESUME or op 2 IDENTIFY. INVALID_SESSION d=false clears session/refreshes token
    and reconnects; d=true keeps resumable session. D: QQ official close-code table allows Resume after 4009, but invalid
    session 4006 and invalid seq 4007 require Identify. These codes must not be interpreted using Discord semantics.'
  openclaw_catchup_filters: 'C: SDK 1.0.4 advances lastSeq and invokes persistence before the unawaited message callback;
    1.0.5 has the same ordering. OpenClaw documentation claims durable admission before sequence advancement, which is not
    corroborated for this external plugin/SDK pair. This indicates a possible crash/restart handoff gap, not proven loss on
    memory-preserving Pause. In-memory message-ID dedupe defaults to 5s; no message-age cutoff found in that filter.'
  wake_inference: '[I] No WS listener/new connection exists while the client process is stopped; a new QQ message cannot itself
    wake it.'
  unknowns:
  - Numeric QQ Resume-validity interval, buffer capacity and fully-offline backlog guarantees; event recovery after fresh
    IDENTIFY.
  - Offline user-send acceptance and bot UI presence.
  - Whether the stronger OpenClaw documentation checkpoint guarantee applies to the actual installed plugin/SDK composition.
  offline_new_event_retention: 'D/U: Official protocol describes conditional short-disconnection Resume replay after the supplied
    seq. Numeric session TTL, buffer capacity and complete fully-offline replay guarantees remain unspecified.'
  evidence:
  - source: S016
    kind: C
    locator: currently describes WebSocket gateway and group/C2C, but omits webhook
    supports:
    - official-doc scope
  - source: S017
    kind: C
    locator: plugin version 2.0.4 and SDK semver range
    supports:
    - plugin revision
    - dependency range
  - source: S018
    kind: C
    locator: repo lock resolves SDK 1.0.4; package is not an installed-version proof
    supports:
    - SDK source selection
  - source: S019
    kind: C
    locator: sessionPersistence and bot.on(message) receive callback
    supports:
    - plugin receive entry
    - session storage
  - source: S020
    kind: C
    locator: SDK 1.0.4 sequence save before DISPATCH and non-awaited callbacks
    supports:
    - sequence ordering
    - handoff boundary
  - source: S021
    kind: C
    locator: SDK 1.0.4 RESUME/IDENTIFY and heartbeat
    supports:
    - resume path
  - source: S022
    kind: C
    locator: SDK 1.0.5 handlePayload/notify cross-check, same sequence-before-callback ordering
    supports:
    - current SDK comparison
  - source: S023
    kind: C
    locator: message-ID dedup window/default and ephemeral map
    supports:
    - catch-up filter
  - source: S024
    kind: C
    locator: OpenClaw docs claim raw-event persistence before resume-seq advancement
    supports:
    - documented durability claim
    - source mismatch
  - source: S151
    kind: D
    locator: 恢复登录态 Session; WebSocket错误码; read via official HTML on 2026-11-04
    supports:
    - new_message_delivery
    - offline_new_event_retention
    - resume_path
    - unacked_retry
  numeric_claims:
  - claim: Plugin repository lock resolves SDK version 1.0.4; manifest allows ^1.0.4.
    scope: Checked plugin repository only; published package allowlist excludes lockfile and installed dependency is unknown.
    source: S018
  - claim: SDK messageFilter default dedup window is 5000ms; plugin invokes it with skipSelfEcho=false, leaving dedup enabled.
    scope: SDK/plugin implementation; process-memory dedup, not replay retention.
    source: S023
- id: qqbot-webhook
  platform: qqbot
  protocol: webhook
  plugin: '@tencent-connect/openclaw-qqbot 2.0.4 at 89988812442583bf47c34b89f9abf5fd4b85df0b; package-lock resolves QQ SDK
    1.0.4 at ca55d9c395b582b7fcfad0ec27209c35dd04e0b3; installed dependency/account HTTP Callback configuration remain unverified.'
  plugin_support: true
  connection_initiator: '[C] QQ platform POSTs callback to configured HTTP route. Plugin adapter registers through OpenClaw
    plugin webhook-ingress while Gateway is running; current fixed OpenClaw core snapshot exports the route helper.'
  paused_state: '[I/U] Plugin route is part of OpenClaw Gateway and does not answer when that process is stopped. Adapter
    fails to register when the host webhook-ingress helper is absent. Independent external receiver/wake responsibility is
    a separate conditional branch.'
