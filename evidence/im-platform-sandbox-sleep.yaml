  numeric_claims:
  - claim: 401 ERR_NOSUCHNICK means the nickname parameter is currently unused.
    scope: IRC RFC 2812 base behavior when the server currently treats the target nick as unused; no assurance about delayed
      failure or network-specific services.
    source: S148
  - claim: 404 ERR_CANNOTSENDTOCHAN concerns sender restrictions such as +n/+m/ban; it does not mean the bot is offline.
    scope: IRC RFC 2812 base numeric semantics.
    source: S148
  - claim: OpenClaw IRC plugin sends PING after 120 seconds of receive silence and destroys the socket after 240 seconds of
      silence.
    scope: OpenClaw source commit f7257f2c66884611f4f4043367eada029b704918; plugin watchdog, not universal IRC server timeout.
    source: S141
  - claim: OpenClaw reconnect backoff starts at 1000ms, maxes at 30000ms, factor 2 with 0.2 jitter and resets after 60000ms
      stable connection.
    scope: OpenClaw source commit f7257f2c66884611f4f4043367eada029b704918; actual delay is jittered and only scheduled while
      process executes.
    source: S143
conditional_variants:
- id: slack-relay-conditional
  platform: slack
  protocol: websocket
  plugin: OpenClaw extensions/slack relay mode v2026.10.10; relay server implementation not reviewed
  plugin_support: true
  connection_initiator: '[C] OpenClaw Gateway initiates a WebSocket connection to configured relay URL. Conditional separate
    Slack socket owner is external to the Gateway.'
  paused_state: '[I/U] If an independent active router owns Slack Socket Mode, Slack may continue delivering there while Gateway
    sleeps. Whether router remains alive is an external condition.'
  user_send_dm: '[I] User can send under the same existing identity and permission assumptions.'
  user_send_group: '[I] User can send under the same existing channel membership and permission assumptions.'
  new_message_delivery: '[U] Router persistence and redelivery during Gateway pause are not established by inspected OpenClaw
    plugin source.'
  unacked_retry: '[C] OpenClaw plugin ACKs relay delivery_id after local durable admission. [U] Router retry semantics while
    Gateway is disconnected are unknown.'
  offline_new_event_retention: '[U] Relay server event retention is unknown; do not infer it from Slack chat history or OpenClaw
    ingress.'
  resume_path: '[C] Gateway reconnects to relay WebSocket after restore. [U] Whether relay replays offline frames depends
    on unreviewed router implementation.'
  openclaw_catchup_filters: '[C] Relay events enter OpenClaw local durable ingress; local processing retries apply after admission.'
  wake_inference: '[I/U] Relay changes the baseline only if there is an active authorized external receiver that actually
    performs wake responsibility. Router-as-receiver alone does not prove wake or durable forwarding.'
  unknowns:
  - '[U] Relay router source/configuration, event retention, delivery ACK protocol and retry policy.'
  - '[U] Whether router has an actual authorized wake path.'
  evidence:
  - source: S066
    kind: C
    locator: 'Slack transport docs: relay mode'
    supports:
    - connection_initiator
  - source: S067
    kind: C
    locator: Relay WebSocket client/reconnect/dispatch
    supports:
    - connection_initiator
    - resume_path
  - source: S058
    kind: C
    locator: acceptRelayEvent; local durable admission before relay ACK
    supports:
    - unacked_retry
    - openclaw_catchup_filters
