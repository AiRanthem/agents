apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-identity-provider
  namespace: sandbox-system
  labels:
    component: agent-identity-provider
    app.kubernetes.io/name: agent-identity-provider
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      component: agent-identity-provider
      app.kubernetes.io/name: agent-identity-provider
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: identity-provider
      labels:
        component: agent-identity-provider
        app.kubernetes.io/name: agent-identity-provider
    spec:
      serviceAccountName: agent-identity-provider
      containers:
        - name: identity-provider
          image: agent-identity-provider:latest
          imagePullPolicy: IfNotPresent
          command:
            - /agent-identity-provider
          args:
            - --leader-elect=true
            - --zap-log-level=info
          ports:
            - containerPort: 8080
              name: metrics
            - containerPort: 8081
              name: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
      terminationGracePeriodSeconds: 10
