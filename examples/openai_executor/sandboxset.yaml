# Verification template for OpenAI self-hosted sessions.
# Build the image first:
#   docker build -t cedex-executor examples/openai_executor
# Replace CODEX_API_KEY with the Agents environment key (not the app API key).
# sandbox-manager must use:
#   --openai-agents-template=openai-session
#   --openai-agents-init-command=/usr/local/bin/connect-openai
apiVersion: v1
kind: Secret
metadata:
  name: openai-environment-key
  namespace: default
type: Opaque
stringData:
  CODEX_API_KEY: REPLACE_ME
---
apiVersion: agents.kruise.io/v1alpha1
kind: SandboxSet
metadata:
  name: openai-session
  namespace: default
  annotations:
    e2b.agents.kruise.io/should-init-envd: "true"
spec:
  replicas: 1
  template:
    spec:
      initContainers:
        - name: init
          image: openkruise/agent-runtime:preview-v0.0.2
          volumeMounts:
            - name: envd-volume
              mountPath: /mnt/envd
          env:
            - name: ENVD_DIR
              value: /mnt/envd
          restartPolicy: Always
      containers:
        - name: sandbox
          image: cedex-executor
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/openai-executor-daemon
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: PORT
              value: "49999"
            - name: ENVD_DIR
              value: /mnt/envd
            - name: CODEX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-environment-key
                  key: CODEX_API_KEY
          volumeMounts:
            - name: envd-volume
              mountPath: /mnt/envd
            - name: workspace
              mountPath: /workspace
          lifecycle:
            postStart:
              exec:
                command:
                  - bash
                  - /mnt/envd/envd-run.sh
          startupProbe:
            failureThreshold: 20
            httpGet:
              path: /health
              port: 49999
            initialDelaySeconds: 1
            periodSeconds: 2
            timeoutSeconds: 1
      terminationGracePeriodSeconds: 1
      volumes:
        - name: envd-volume
          emptyDir: {}
        - name: workspace
          emptyDir: {}
