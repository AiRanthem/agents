      content: "# OpenKruise Agents Guide\n\nThis file contains repository-wide rules.\n\
        \n## Instruction Scope\n\n- Root rules apply repository-wide; keep durable\
        \ cross-file or silently critical\n  constraints in the deepest applicable\
        \ `AGENTS.md`, leave details and public\n  contracts to their owning code,\
        \ tests, specifications, or proposals, and\n  review changes root-to-leaf\
        \ before removing guidance.\n\n## Control Plane Layering\n\n### Sandbox-manager\
        \ Runtime Contract\n\n- Sandbox recycle cannot occur in any cluster running\
        \ sandbox-manager. All\n  sandbox-manager API, Manager, Infra, cache, quota,\
        \ and token flows treat\n  recycle as nonexistent; do not add recycle-specific\
        \ handling or compatibility.\n- The independent Sandbox controller retains\
        \ recycle support for other\n  deployments. Its recycle capability does not\
        \ imply CR reuse across deliveries\n  in sandbox-manager deployments.\n\n\
        ### API Layer — sandbox-manager\n\n- The API layer is `pkg/servers/**`, including\
        \ E2B-compatible protocols.\n- It owns routing, transport protocols, request\
        \ and response models,\n  protocol-level validation, authentication and authorization,\
        \ error and status\n  mapping, and compatibility behavior.\n- Logic that directly\
        \ expresses an API protocol contract must remain here. Do\n  not push protocol\
        \ models, HTTP semantics, or compatibility rules into Manager\n  or Infra.\n\
        \n### Manager Layer — sandbox-manager\n\n- The Manager layer is `pkg/sandbox-manager/**`,\
        \ excluding its `infra/**`\n  subtree.\n- It owns protocol- and backend-independent\
        \ business rules and use-case\n  orchestration, including lifecycle, quota,\
        \ admission, and release policy.\n- It accesses Sandbox backends only through\
        \ neutral Infra interfaces and must\n  not depend on `pkg/servers` or directly\
        \ read or write backend-state resources.\n- Classify Kubernetes-backed capabilities\
        \ by ownership, not technology:\n  sandbox-manager process coordination, discovery,\
        \ publication, and identity\n  allocation stay in Manager when they are not\
        \ Sandbox backend capabilities.\n\n### Infra Layer — sandbox-manager\n\n-\
        \ The Infra layer is `pkg/sandbox-manager/infra/**`. It owns Sandbox backend\n\
        \  infrastructure, not every Kubernetes operation used by sandbox-manager.\n\
        - Concrete Kubernetes implementations of Sandbox infrastructure capabilities\n\
        \  and their clients, caches, reads, and writes belong in implementation\n\
        \  subpackages such as `infra/sandboxcr`.\n- It exposes protocol-neutral Sandbox\
        \ capabilities and data upward. It must not\n  depend on API models, HTTP\
        \ status codes, authentication semantics, or Manager\n  business policy.\n\
        \n### Agent Sandbox Controller\n\n- `cmd/agent-sandbox-controller` and `pkg/controller/**`\
        \ form an independent\n  Kubernetes operator.\n- The controller's complete\
        \ dependency closure must not include\n  `pkg/servers/**` or `pkg/sandbox-manager/**`.\
        \ Code shared with\n  sandbox-manager must move to a genuinely neutral package;\
        \ a shared or utility\n  package must not hide an indirect reverse dependency.\n\
        - Controllers may reconcile CRDs directly, but must not reuse sandbox-manager\n\
        \  API behavior, business orchestration, or Infra implementations.\n\n###\
        \ Kubernetes Read Discipline\n\n- Never use `APIReader` for `List`; prefer\
        \ informer-backed clients or caches\n  for Kubernetes reads.\n- Use `APIReader`\
        \ for `Get` only when informer-backed reads cannot provide\n  acceptable correctness\
        \ or functionality, and only after explaining why and\n  obtaining explicit\
        \ user approval.\n\n### Dependency Rules\n\n- New sandbox-manager dependencies\
        \ follow `API -> Manager -> Infra`. Do not\n  add API-to-Infra shortcuts or\
        \ lower-to-upper reverse dependencies.\n- `pkg/features` is controller-only.\
        \ Code under `pkg/sandbox-manager/**` and\n  `pkg/servers/**` must not import\
        \ it or consume its gates through a shared\n  wrapper.\n- For optional sandbox-manager\
        \ behavior, prefer interface or option parameters\n  that control a single\
        \ call. Avoid package-global or process-global feature\n  switches. Add a\
        \ global switch only when per-call control cannot safely express\n  the requirement,\
        \ and document why global scope is necessary.\n- `cmd/*` entrypoints assemble\
        \ dependencies and start components only; business\n  logic belongs in the\
        \ appropriate layer.\n- These rules are normative for new work. Existing cross-layer\
        \ imports are\n  legacy debt, not architectural precedent: do not add to or\
        \ widen them. If a\n  task requires a wider violation, propose a layering\
        \ refactor first.\n- Shared packages must stay policy-neutral and must not\
        \ import domain-specific\n  packages merely to make reuse convenient.\n\n\
        ## Development\n\n- Follow standard Go idioms. Run `gofmt -w` on changed Go\
        \ files.\n- New Go files must use the Apache 2.0 header from\n  `hack/boilerplate.go.txt`.\
        \ Keep code comments in English.\n- Prefer table-driven unit tests. Extend\
        \ a suitable existing table; use a\n  standalone test only when no table fits.\n\
        - Do not introduce test stubs, fakes, or mocks unless necessary. Prefer\n\
        \  exercising real implementations or existing test infrastructure first.\n\
        - Do not create abstract interfaces or new types unless necessary. Introduce\n\
        \  an abstraction only when a concrete, current need requires it.\n- Test\
        \ only when needed, using the narrowest changed package or selected test\n\
        \  (`-run`, `-count=1`). Do not run unrelated tests or repeat stable tests.\
        \ For\n  probabilistic failures, races, or other concurrency risks, rerun\
        \ the relevant\n  test enough times to trust it (`-count=N`, `-race`). `make\
        \ test` runs the full\n  `pkg/...` suite; use `make vet` and `make lint` only\
        \ when warranted. Never run\n  E2E tests for ordinary validation.\n- Check\
        \ cancellation in retrying or long-running work and preserve meaningful\n\
        \  error context.\n- Do not add Prometheus metrics (new collectors, counters,\
        \ gauges, histograms,\n  or instrumentation) unless the user explicitly requests\
        \ them.\n\n## Generated Files And Design Changes\n\n- Do not edit generated\
        \ files under `client/`, `proto/`, or `config/crd/`\n  directly.\n- After\
        \ changing `api/v1alpha1/`, run `make generate manifests`. Use\n  `make generate`\
        \ or `make manifests` for their respective generated\n  outputs.\n- New APIs\
        \ and architectural changes require a proposal in `docs/proposals/`.\n- Prefer\
        \ responsibility-specific package names. Do not create new catch-all\n  `utils`,\
        \ `common`, `helpers`, `util`, or `base` packages.\n\n## Errors And Logging\n\
        \n- Never ignore errors. Classify wrapped errors with `errors.Is` and\n  `errors.As`;\
        \ use Kubernetes API error helpers for Kubernetes errors and\n  `client.IgnoreNotFound`\
        \ only where absence is acceptable.\n- Sandbox-manager domain errors belong\
        \ in\n  `pkg/sandbox-manager/errors/`; transport status mapping belongs in\
        \ the API\n  layer.\n- Use structured key-value logging. Controllers use\n\
        \  `logf.FromContext(ctx)`; sandbox-manager code uses\n  `klog.FromContext(ctx)`.\
        \ Do not use `fmt.Println` for runtime logging.\n\n## Repository Hygiene\n\
        \n- Do not remove useful comments unless they are obsolete.\n- A new submodule\
        \ `AGENTS.md` must have a sibling `CLAUDE.md` whose sole\n  content is `@./AGENTS.md`.\n\
        - Commits must include sign-off, for example `git commit -s`.\n"
