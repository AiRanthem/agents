        `release-notes/components/ACK-COMPONENT/` 保存镜像元数据及源 note 哈希快照，并另记编排 commit；缺失或冲突时才回查产物。应用镜像发布和组件更新分开调用。对外文档发布组件白名单版本/日期/变更内容，以及该组件版本捆绑的各应用镜像版本
        tag；源码与编排 commit、流水线、digest、完整 dev 镜像 tag、仓库地址与内部路径仍留在内部记录。具体格式共用 `release-oka-app/references/release-note-contract.md`。

        - 对外文档中的镜像版本 tag 取该组件版本实际部署到 `acs/` 命名空间的 tag，权威来源是 `ack-components` 对应版本目录的
        `configs/default.yaml`（`values.yaml` 是 chart 默认值，可能陈旧；`component.yaml` 的 `images:`
        段是 dev→acs 同步映射，用于反查源镜像）。同步技能在渲染时实时读取组件仓取值，读不到就停下问用户，不用记录里的 `git_tag` 或 `image_tag`
        顶替。每个组件版本按应用分别列出管控面（sandbox-manager）与网关（sandbox-gateway）镜像 tag。仓库历史中查不到镜像记录的早期组件版本（`ack-sandbox-manager`
        的 v0.1.0–v0.4.3、v0.5.2）跳过镜像行，其余内容照常发布。

        - 组件编排落位时，同步到 `acs/` 的目标 tag 写应用版本号，由应用镜像记录的 `git_tag` 去掉 `ack-<APP>-` 前缀得到（`ack-sandbox-api-v0.6.14-release.1`
        → `v0.6.14-release.1`），并同时写入 `component.yaml` 的 `源镜像;目标tag`、`values.yaml`
        与 `configs/default.yaml`；源镜像一侧写记录里的完整 dev 镜像地址。`image_tag` 只用于源镜像一侧与产物追溯。`git_tag`
        为 `null`（从任意 commit 构建）时停下问用户指定目标 tag。这样 `acs/` 里的镜像 tag 与对外文档发布的镜像版本一致，且
        commit 与构建时间戳不进入对外文档。细则见 `release-oka-component/references/orchestration-edit.md`。

        - 组件更新先询问 `ack-components` 的目标版本分支，在 `worktrees/` 隔离检出，依据分支现状推荐 release/alpha
        给用户选择；完成编排修改与该分支代码推送即结束，不自动建 MR、部署或启动生产 rollout。修改公共组件说明只产生本地文件；发布它需另有授权。

        - 官方文档中的每个 `ack-sandbox-manager` 组件版本都必须标明 E2B Python SDK（`e2b` 包）的兼容范围，并带明确下界。下界由用户手动指定；每次正式版本更新官网文档时，将下界与是否封顶合并询问并复用已有明确答复。封顶、解除封顶、继承封顶及两篇接入文档的安装命令联动遵循
        `.agents/skills/sync-oka-release-notes/references/e2b-compatibility.md`。


