    - path: /Users/sophon/Workspace/OKAWorkspace/projects/oka-daily-open-source/AGENTS.md
      content: '# OKA 日常开源开发


        This is the management workspace for project `oka-daily-open-source`. Resolve
        the caller-supplied project entrypoint through installed `manage-workitems/references/commands.md`;
        use shared `manage-workitems/scripts/project.py` only when no caller binding
        exists. The program owns configuration, YAML state, dependencies, document
        routes and Git/Aone publication.


        Operate this project serially on one machine. Any local session may continue
        authorized work from the current artifacts and saved operation records. Finish
        or recover the current operation before beginning the next. Session identities
        record actual authors, reviewers and operation provenance. Read-only investigations
        and reviews keep project records and source unchanged and return a separate
        report bound to stable inputs.


        The user may explicitly skip any verification checkpoint for the specified
        current scope. Follow the command contract''s user verification decisions:
        register the actual source and target as a named `validation-waiver`, honor
        the skip and report its limits. Explicit human acceptance of the current implementation
        uses `begin human-acceptance ID --approval-source SOURCE`: preserve the user’s
        final code and design, reconcile remaining outdated design text and write
        the comparison report, then finish to publish design and acceptance together.
        The human conclusion covers that alignment and enters waiting for delivery
        without additional design approval or independent design/code review, with
        truthful `human_acceptance` provenance. Preserve downstream designs for their
        own later design review. User code/design edits during human acceptance are
        final drafts and stay in the acceptance/delivery phase without further review.
        Reuse an existing covering acceptance conclusion when updating final-draft
        bindings; wait for the actual conclusion if none exists. Changed ticket inputs
        still require a fresh checkpoint and current reads. A PR alone establishes
        no acceptance. Default review, verification and acceptance gates below apply
        unless covered by such a current user decision. Never relabel a skip or human
        acceptance as an executed check or independent review. Host permissions, data
        safety and transaction integrity retain their own requirements.


        For a script failure, follow installed `manage-workitems/references/recovery.md`
        under "User-authorized manual recovery". Investigate actual facts and prepare
        a concrete correction; covering explicit user authorization permits the scoped
        state/file changes and script repair. Preserve genuine approvals/reviews,
        uncertain transactions, source and recovery data; actual permissions still
        apply. Stage executors return recovery needs to the controller.


        For each ordinary requested work-item write operation, run `begin OP [ID]`
        with its typed inputs. Read the complete returned `read` payload and actually
        read required original external instruction paths. Edit only the absolute
        Markdown paths in `editable`, then execute the returned `finish_command` unchanged;
        design review, design-reuse assessment and implementation review declare `--result
        pass|fail --provenance SOURCE` arguments supplied after the actual assessment;
        design review may additionally declare `--contract-unchanged` for actual independent
        confirmation and `--mechanical-correction` for an authorized mechanical candidate
        edit. Such an edit uses the returned `spec.md` draft and actual pass with
        both flags; the runtime retains original substantive authors and binds the
        final candidate and exact diff. The project operator/controller records actual
        applicability through `design-reuse`. `published` or `no_op` ends the operation;
        `partial` permits only the returned resume command; `blocked` with `code:
        stale_ticket` permits only its returned `next_command` to begin the same operation
        again; expired tickets carrying authorization or review evidence return `code:
        stale_evidence` without a continuation command; other blockers or missing
        input mean report the listed facts and stop the affected operation. For ordinary
        operations, use the returned drafts and program-maintained state, gates and
        publication results. Route script defects to the recovery contract above.


        For execution-mode handoff, generation replacement and registered internal
        resources, use the direct typed `lifecycle` commands in the command contract.
        Preserve completed stage work, source recovery, explicit lifecycle policy
        and exact collection manifests. Diagnostic `ready` does not establish design
        approval or implementation eligibility.


        For project knowledge, run `knowledge-show ID` and use its returned complete
        update/remove commands and byte guards. Maintain the current YAML metadata
        and same-id Markdown body through those commands; replace current knowledge
        in full or explicitly remove it.


        The program includes current business instructions from `.project/project-instructions.md`
        and current context in its inputs. Project documents contain only current
        effective content; Git retains prior versions. Keep current approval, delivery
        and unresolved recovery credentials. For an associated main workspace, required
        original `AGENTS.md` paths must be returned and read before dependent work;
        a copied summary does not replace them. Read the code repository''s applicable
        instructions before source operations.


        Use `manage-workitems` for requirements, `split-workitem` for requested decomposition,
        `develop-workitem` for requested design/implementation, `complete-workitem`
        for verified delivery and separately requested cleanup, and `upgrade-project`
        for deterministic migration/instruction refresh. Creation ends at metadata
        and requirement skeletons. Design and independent design review each require
        the user''s request; reuse existing explicit authorization for unchanged scope.
        The design owner obtains user confirmation before formal spec publication,
        reusing approval of an unchanged complete contract. Publication records that
        approval and its version binding for the authorized independent review. Oversized
        parents include the full design, usable stages and DAG and select `design-update
        --next-action split` before review. Current independent Pass routes them to
        `split-workitem`. Children inherit complete relevant specs and can enter their
        own review directly; only demonstrated blocking gaps require supplemental
        design. Future child refinement never reduces parent rigor; changes to shared
        or parent contracts return to that design layer for confirmation and affected
        review. Implementation requires current independent design-review coverage
        or an actual user-scoped simple-requirement waiver, plus delivered prerequisites
        and recorded development preparation. Follow `review-design/references/implementable-gate.md`
        for a complete first review and subsequent reuse of valid coverage, with independent
        assessment of changes and affected interactions. The authorized project operator/controller
        uses `design-reuse` to assess retained independent coverage against unchanged
        current contracts and assumptions; this preserves the original reviewer and
        approval with current bindings, and creates neither a new independent Pass
        nor a waiver. A failed assessment requires affected independent review; material
        contract changes still require actual approval. Reviewers default to read-only;
        uniquely determined mechanical corrections within the authorized candidate
        do not block Pass or constitute substantive authorship, and may be corrected
        and assessed in the same round under the shared standard. A separate author
        corrects substantive blockers, then the original reviewer is preferred while
        still independent. Equivalent documentation and contract-preserving implementation
        corrections do not themselves require a complete design re-review. Formal
        baseline changes require design-applicability assessment and independent formal
        code review; user-owned contract changes still need actual approval. For a
        simple requirement, the user may explicitly authorize `development-start --skip-design-review
        --approval-source SOURCE` for this unchanged contract; the program records
        a requirement/spec/base/dependency-bound waiver, not a review pass. The agent
        cannot decide to skip review itself. Project publication does not authorize
        code commits or code pushes. Preserve main-workspace, cleanup, removal and
        other user permission boundaries.

        '
