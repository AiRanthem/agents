  diff: "--- original/spec.md\n+++ candidate/spec.md\n@@ -103,7 +103,7 @@\n \n 续期与自动唤醒是独立选择。仅开启续期不会使\
    \ Paused Sandbox 自动恢复，也不会绕过 Gateway 的唤醒总开关。Running Sandbox 的续期不依赖唤醒总开关。\n \n-两者都开启且通过既有唤醒条件时，共用\
    \ connect 核心能力以保存的 R 发起恢复。计时 Sandbox 沿用现有恢复保护，将本次恢复时长取为 `max(R, 300 秒)`；这不改写保存的\
    \ H、R。解除暂停与初始新期限必须在同一次受保护状态更新中完成，避免旧期限在恢复途中生效。恢复成功后的补充延期遵守上述恢复有效性和只延长条件；流量等到 Sandbox\
    \ Ready、路由可用后再转发。\n+两者都开启且通过既有唤醒条件时，共用 connect 核心能力以保存的 R 发起恢复。计时 Sandbox 沿用现有恢复保护，将本次恢复时长取为\
    \ `max(R, 300 秒)`；这不改写保存的 H、R。此时恢复时长由 R 决定，不采用唤醒规则 `AutoPausePolicy.Resume.OnIngressTraffic.PauseTimeout`。解除暂停与初始新期限必须在同一次受保护状态更新中完成，避免旧期限在恢复途中生效。恢复成功后的补充延期遵守上述恢复有效性和只延长条件；流量等到\
    \ Sandbox Ready、路由可用后再转发。\n \n 自动暂停模式重新设置暂停期限和对应的暂停保留窗口；自动销毁模式只重新设置销毁期限。无期限对象仍保持无期限。未开启续期的\
    \ Sandbox 继续使用已有唤醒行为。恢复失败、等待超时或请求取消继续沿用现有唤醒的返回和取消语义。\n \n@@ -124,6 +124,8 @@\n\
    \ 没有阈值的对象保持关闭，不自动迁移或启用历史对象。持久化策略缺失、非法或不可安全表示时 Gateway 跳过续期，对异常值记录诊断，不猜测或回填。新 API\
    \ 与支持该能力的 Gateway 配合才能提供完整能力：旧 API 不识别这些扩展，旧 Gateway 不执行续期；混合版本期间不能保证配置更新被识别或任意流量路径均触发续期。升级、回滚均不将无期限对象转为计时对象。\n\
    \ \n 本次复用既有 create/connect/timeout 入口，不增加独立配置接口、CRD spec 字段或模板级默认开关。暂停保留策略、自动唤醒准入和其他主动暂停规则保持各自职责。\n\
    +\n+新增扩展参数、系统 annotation 和共享生命周期核心属于仓库规则所指的新 API 和架构变更，实现交付须在 `docs/proposals/`\
    \ 提交描述本设计的提案。\n \n 本功能延长生命周期期限，不改变访问令牌有效期、代理空闲超时、负载均衡连接限制或其他主动暂停规则。它不能阻止手动暂停/删除、探针驱动暂停、集群故障或已经发生的到期动作。接近到期时的突发流量和后端故障可能来不及续期；异步设计提供尽力续期，不承诺每一次合格流量都能阻止到期。\n\
    \ \n"
