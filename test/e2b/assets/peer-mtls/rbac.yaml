apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: peer-mtls-gateway-secret-reader
  namespace: sandbox-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - peer-mtls-server
      - peer-mtls-gateway-client
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: peer-mtls-gateway-secret-reader
  namespace: sandbox-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: peer-mtls-gateway-secret-reader
subjects:
  - kind: ServiceAccount
    name: sandbox-gateway
    namespace: sandbox-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: peer-mtls-helper
  namespace: sandbox-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: peer-mtls-helper
  namespace: sandbox-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - peer-mtls-server
      - peer-mtls-helper-client
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: peer-mtls-helper
  namespace: sandbox-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: peer-mtls-helper
subjects:
  - kind: ServiceAccount
    name: peer-mtls-helper
    namespace: sandbox-system
