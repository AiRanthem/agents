interface:
  display_name: "Review Implementation"
  short_description: "Review an implementation in single-agent or multi-agent mode"
  default_prompt: "Use $review-implementation to review this implementation against its confirmed design. Resolve mode first: advance-project uses single-agent without asking; otherwise honor my existing choice or ask once whether to use multi-agent before reviewing. Report findings, mode, coverage and evidence."
policy:
  allow_implicit_invocation: false
